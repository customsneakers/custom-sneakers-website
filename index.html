<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Custom Sneakers — Official Website</title>
  <meta
    name="description"
    content="Official website of Custom Sneakers, a registered trademark in Portugal."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px 24px 64px;
    }

    .content {
      width: 100%;
      max-width: 760px;
      text-align: center;
    }

    .symbol-logo {
      display: block;
      width: auto;
      height: auto;
      max-width: 180px;
      max-height: 180px;
      margin: 0 auto 42px;
      object-fit: contain;
    }

    .development {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.30em;
      line-height: 1.6;
      color: #000000;
      text-transform: uppercase;
    }

    .divider {
      width: 64px;
      height: 1px;
      background: #000000;
      margin: 42px auto;
      opacity: 0.22;
    }

    .trademark {
      font-size: 15px;
      line-height: 1.8;
      color: #000000;
    }

    .registration {
      margin-top: 4px;
      font-size: 14px;
      line-height: 1.8;
      color: #000000;
    }

    .contact {
      margin-top: 34px;
      font-size: 14px;
      line-height: 2;
      color: #000000;
    }

    .contact a {
      color: #000000;
      text-decoration: none;
      font-weight: 600;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    footer {
      width: 100%;
      padding: 24px;
      text-align: center;
      border-top: 1px solid #eeeeee;
      font-size: 11px;
      color: #000000;
      letter-spacing: 0.04em;
    }

    @media (max-width: 700px) {
      main {
        padding: 54px 22px 48px;
      }

      .content {
        max-width: 520px;
      }

      .symbol-logo {
        max-width: 120px;
        max-height: 120px;
        margin-bottom: 34px;
      }

      .development {
        font-size: 12px;
        letter-spacing: 0.22em;
        line-height: 1.7;
      }

      .divider {
        width: 52px;
        margin: 34px auto;
      }

      .trademark,
      .registration,
      .contact {
        font-size: 12px;
      }

      .contact {
        margin-top: 28px;
      }

      footer {
        padding: 20px 16px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <main>
    <div class="content">

      <img
        src="logo-symbol.png"
        alt="Custom Sneakers logo"
        class="symbol-logo"
      >

      <div class="development">
        Website Currently Under Development
      </div>

      <div class="divider"></div>

      <div class="trademark">
        Custom Sneakers is a registered trademark in Portugal.
      </div>

      <div class="registration">
        Portuguese Trademark Registration No. 766189
      </div>

      <div class="contact">
        Official website:
        <a href="https://custom-sneakers.com/">
          custom-sneakers.com
        </a>
        <br>

        Contact:
        <a href="mailto:info@custom-sneakers.com">
          info@custom-sneakers.com
        </a>
      </div>

    </div>
  </main>

  <footer>
    © 2026 Custom Sneakers. All rights reserved.
  </footer>

</body>
</html>
